name: 'Login to Prime Registry'
description: 'Read prime registry credentials (including hostname) from Vault and log in'

outputs:
  registry:
    value: ${{ steps.generate.outputs.registry }}
    description: 'Resolved prime registry hostname (read from Vault)'
  repository:
    value: ${{ steps.generate.outputs.repository }}
    description: 'Prime registry repository or organization'

runs:
  using: "composite"
  steps:
    - name: Read Secrets for Prime Registry
      uses: rancher-eio/read-vault-secrets@d266f55186f80a893839f6e15662e67388e443e6 # v3
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | PRIME_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | PRIME_REGISTRY_PASSWORD

    - name: Login to Prime Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ${{ env.PRIME_REGISTRY }}
        username: ${{ env.PRIME_REGISTRY_USERNAME }}
        password: ${{ env.PRIME_REGISTRY_PASSWORD }}

    - name: Expose registry destination
      id: generate
      shell: bash
      run: |
        echo "registry=${PRIME_REGISTRY}" >> "$GITHUB_OUTPUT"
        echo "repository=harvester" >> "$GITHUB_OUTPUT"
