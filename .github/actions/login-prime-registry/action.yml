name: 'Login to Prime Registry'
description: 'Read prime registry credentials (including hostname) from Vault and log in'

inputs:
  prime-registry:
    description: 'Prime registry hostname'
    required: true
  prime-username:
    description: 'Username for prime registry login'
    required: true
  prime-password:
    description: 'Password/token for prime registry login'
    required: true

outputs:
  registry:
    value: ${{ steps.generate.outputs.registry }}
    description: 'Resolved prime registry hostname (read from Vault)'
  repository:
    value: ${{ steps.generate.outputs.repository }}
    description: 'Prime registry repository or organization'

runs:
  using: "composite"
  steps:
    - name: Login to Prime Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ${{ inputs.prime-registry }}
        username: ${{ inputs.prime-username }}
        password: ${{ inputs.prime-password }}

    - name: Expose registry destination
      id: generate
      shell: bash
      run: |
        echo "registry=${{ inputs.prime-registry }}" >> "$GITHUB_OUTPUT"
        echo "repository=freezevicente" >> "$GITHUB_OUTPUT"
