name: 'Login to Staging Registry'
description: 'Read staging registry credentials (including hostname) from Vault and log in'

inputs:
  staging-registry:
    description: 'Staging registry hostname'
    required: true
  staging-username:
    description: 'Username for staging registry login'
    required: true
  staging-password:
    description: 'Password/token for staging registry login'
    required: true
outputs:
  registry:
    value: ${{ steps.generate.outputs.registry }}
    description: 'Resolved staging registry hostname (read from Vault)'
  repository:
    value: ${{ steps.generate.outputs.repository }}
    description: 'Staging registry repository or organization'

runs:
  using: "composite"
  steps:
    - name: Login to Staging Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ${{ inputs.staging-registry }}
        username: ${{ inputs.staging-username }}
        password: ${{ inputs.staging-password }}

    - name: Expose registry destination
      id: generate
      shell: bash
      run: |
        echo "registry=${{ inputs.staging-registry }}" >> "$GITHUB_OUTPUT"
        echo "repository=bk201z" >> "$GITHUB_OUTPUT"
