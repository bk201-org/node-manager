name: 'Login to Staging Registry'
description: 'Read staging registry credentials (including hostname) from Vault and log in'

outputs:
  registry:
    value: ${{ steps.generate.outputs.registry }}
    description: 'Resolved staging registry hostname (read from Vault)'
  repository:
    value: ${{ steps.generate.outputs.repository }}
    description: 'Staging registry repository or organization'

runs:
  using: "composite"
  steps:
    - name: Read Secrets for Staging Registry
      uses: rancher-eio/read-vault-secrets@d266f55186f80a893839f6e15662e67388e443e6 # v3
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/rancher-staging-registry/credentials registry | STAGING_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-staging-registry/credentials username | STAGING_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-staging-registry/credentials password | STAGING_REGISTRY_PASSWORD

    - name: Login to Staging Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ${{ env.STAGING_REGISTRY }}
        username: ${{ env.STAGING_REGISTRY_USERNAME }}
        password: ${{ env.STAGING_REGISTRY_PASSWORD }}

    - name: Expose registry destination
      id: generate
      shell: bash
      run: |
        echo "registry=${STAGING_REGISTRY}" >> "$GITHUB_OUTPUT"
        echo "repository=harvester" >> "$GITHUB_OUTPUT"
