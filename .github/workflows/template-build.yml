on:
  workflow_call:
    inputs:
      refs:
        required: false
        type: string
      release-tag-name:
        required: true
        type: string
      push:
        required: true
        type: boolean
      skip-ci:
        required: false
        type: boolean
        default: false
      skip-integration-tests:
        required: false
        type: boolean
        default: false
env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  ci:
    if: ${{ inputs.skip-ci == false }}
    runs-on:
      - self-hosted
    steps:
      - name: Checkout code without refs
        if: ${{ inputs.refs == '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout code with refs
        if: ${{ inputs.refs != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.refs }}

      - name: "Run validations"
        run: |
          make validate
          make validate-ci

      - name: "Build node manager"
        run: |
          BUILD_FOR_CI=true make

  integration-tests:
    needs: ci
    if: ${{ inputs.skip-ci == false && inputs.skip-integration-tests == false }}
    runs-on:
      - self-hosted
      - harvester-runners
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code without refs
        if: ${{ inputs.refs == '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout code with refs
        if: ${{ inputs.refs != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.refs }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up yq
        env:
          YQ_VERSION: v4.47.2
          YQ_SHA256: 1bb99e1019e23de33c7e6afc23e93dad72aad6cf2cb03c797f068ea79814ddb0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLf -o "$RUNNER_TEMP/bin/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/bin/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create RKE2 cluster
        id: cluster
        uses: bk201-org/harvester-runner-gateway/actions/create-rke2-cluster@main
        with:
          gateway-url: ${{ vars.GATEWAY_URL }}
          vm-count: '2'
          image: ${{ vars.GATEWAY_IMAGE }}
          network: ${{ vars.GATEWAY_NETWORK }}
          cpu: '4'
          memory: 8Gi
          boot-disk-size: 40Gi
          username: ubuntu
          ttl-seconds: '7200'

      - name: Export cluster environment
        env:
          VM_IDS: ${{ steps.cluster.outputs.vm-ids }}
          KUBECONFIG_PATH: ${{ steps.cluster.outputs.kubeconfig-path }}
          SSH_CONFIG_PATH: ${{ steps.cluster.outputs.ssh-config-path }}
          PRIVATE_KEY_PATH: ${{ steps.cluster.outputs.private-key-path }}
          SERVER_VM_ID: ${{ steps.cluster.outputs.server-vm-id }}
        run: |
          {
            echo "KUBECONFIG=${KUBECONFIG_PATH}"
            echo "CLUSTER_NODES=$(jq length <<<"${VM_IDS}")"
            echo "CLUSTER_SSH_CONFIG=${SSH_CONFIG_PATH}"
            echo "CLUSTER_SSH_KEY=${PRIVATE_KEY_PATH}"
            echo "CLUSTER_NODE=${SERVER_VM_ID}"
          } >> "$GITHUB_ENV"

      - name: "Deploy latest node manager"
        run: |
          ./ci/deploy_nm.sh

      - name: "Upgrade node manager to dev version"
        run: |
          ./ci/upgrade_nm.sh

      - name: "Run integration tests"
        run: |
          go test -v ./tests/... -count=1

  dapper-build:
    needs:
      - ci
      - integration-tests
    if: ${{ always() && inputs.push == true && (inputs.skip-ci == true || (needs.ci.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.integration-tests.result))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: harvester-node-manager
            dockerfile: package/Dockerfile
          - image: harvester-node-manager-webhook
            dockerfile: package/Dockerfile.webhook
    steps:
      - name: Checkout code without refs
        if: ${{ inputs.refs == '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout code with refs
        if: ${{ inputs.refs != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.refs }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: ci
        run: make ci

      - name: Package
        run: make package

      - name: Package webhook
        run: make package-webhook

      - name: Build and publish ${{ matrix.image }} image
        uses: harvester/harvester-actions/actions/build-and-publish@18134d283bc63c5a7ffb25191e6cd2f367a10932 # main
        with:
          release-tag-name: ${{ inputs.release-tag-name }}
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
